name: Construir APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Crear archivos de la app
        run: |
          cat > settings.gradle <<'FIN_ARCHIVO'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ContadorBidones"
          include ':app'
          FIN_ARCHIVO
          cat > build.gradle <<'FIN_ARCHIVO'
          // archivo principal del proyecto
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          FIN_ARCHIVO
          cat > gradle.properties <<'FIN_ARCHIVO'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          FIN_ARCHIVO
          mkdir -p app
          cat > app/build.gradle <<'FIN_ARCHIVO'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'cl.bidones.contador'
              compileSdk 34

              defaultConfig {
                  applicationId "cl.bidones.contador"
                  minSdk 26
                  targetSdk 34
                  versionCode 9
                  versionName "9.0"
              }

              // clave fija para firmar: asi cada version nueva se instala encima sin borrar los datos
              signingConfigs {
                  fija {
                      storeFile file("clave.jks")
                      storePassword "bidones123"
                      keyAlias "bidones"
                      keyPassword "bidones123"
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.fija
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.fija
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          // no usa librerias externas, todo es con lo que trae Android
          dependencies {
          }
          FIN_ARCHIVO
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'FIN_ARCHIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- para que el boton Llamar llame directo (se pide permiso la primera vez) -->
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <!-- para la llamada directa por WhatsApp (busca el contacto en la agenda) -->
              <uses-permission android:name="android.permission.READ_CONTACTS" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:theme="@style/TemaBidones">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

              </application>

          </manifest>
          FIN_ARCHIVO
          mkdir -p app/src/main/java/cl/bidones/contador
          cat > app/src/main/java/cl/bidones/contador/MainActivity.java <<'FIN_ARCHIVO'
          package cl.bidones.contador;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.database.Cursor;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.ContactsContract;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;

          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.io.OutputStream;

          public class MainActivity extends Activity {

              private static final int GUARDAR = 1;
              private static final int ABRIR = 2;
              private static final int CONTACTO = 3;
              private static final int PERMISO_LLAMAR = 10;
              private static final int PERMISO_CONTACTOS = 11;

              private WebView web;
              private String contenidoPorGuardar = null;
              private Uri numeroPorLlamar = null;
              private String whatsappPorLlamar = null;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);

                  // activar javascript y el guardado local (localStorage)
                  WebSettings config = web.getSettings();
                  config.setJavaScriptEnabled(true);
                  config.setDomStorageEnabled(true);

                  // la pantalla se queda dentro de la app; llamadas y whatsapp se abren afuera
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView vista, WebResourceRequest pedido) {
                          Uri url = pedido.getUrl();
                          String tipo = url.getScheme();
                          if ("file".equals(tipo)) {
                              return false;
                          }
                          if ("tel".equals(tipo)) {
                              llamar(url);
                          } else if ("wa.me".equals(url.getHost()) && "1".equals(url.getQueryParameter("llamar"))) {
                              String numero = url.getPath() == null ? "" : url.getPath().replace("/", "");
                              llamarWhatsApp(numero);
                          } else if ("wa.me".equals(url.getHost())) {
                              abrirWhatsApp(url);
                          } else {
                              abrir(new Intent(Intent.ACTION_VIEW, url));
                          }
                          return true;
                      }
                  });

                  // funciones que la pantalla puede usar: Android.guardarArchivo(...) y Android.abrirArchivo()
                  web.addJavascriptInterface(new Puente(), "Android");

                  setContentView(web);

                  // la pantalla esta en app/src/main/assets/index.html
                  web.loadUrl("file:///android_asset/index.html");
              }

              private boolean abrir(Intent i) {
                  try {
                      startActivity(i);
                      return true;
                  } catch (Exception e) {
                      return false;
                  }
              }

              // llama directo; la primera vez pide permiso. Si no lo dan, abre el marcador con el numero escrito
              private void llamar(Uri numero) {
                  if (checkSelfPermission(Manifest.permission.CALL_PHONE) == PackageManager.PERMISSION_GRANTED) {
                      if (!abrir(new Intent(Intent.ACTION_CALL, numero))) {
                          abrir(new Intent(Intent.ACTION_DIAL, numero));
                      }
                  } else {
                      numeroPorLlamar = numero;
                      requestPermissions(new String[]{Manifest.permission.CALL_PHONE}, PERMISO_LLAMAR);
                  }
              }

              @Override
              public void onRequestPermissionsResult(int pedido, String[] permisos, int[] resultados) {
                  super.onRequestPermissionsResult(pedido, permisos, resultados);
                  if (pedido == PERMISO_CONTACTOS && whatsappPorLlamar != null) {
                      String numero = whatsappPorLlamar;
                      whatsappPorLlamar = null;
                      if (resultados.length > 0 && resultados[0] == PackageManager.PERMISSION_GRANTED) {
                          llamarWhatsApp(numero);
                      } else {
                          avisar("Sin permiso de contactos no se puede llamar directo. Se abre el chat.");
                          abrirWhatsApp(Uri.parse("https://wa.me/" + numero));
                      }
                      return;
                  }
                  if (pedido == PERMISO_LLAMAR && numeroPorLlamar != null) {
                      Uri numero = numeroPorLlamar;
                      numeroPorLlamar = null;
                      if (resultados.length > 0 && resultados[0] == PackageManager.PERMISSION_GRANTED) {
                          abrir(new Intent(Intent.ACTION_CALL, numero));
                      } else {
                          abrir(new Intent(Intent.ACTION_DIAL, numero));
                      }
                  }
              }

              private void avisar(String texto) {
                  Toast.makeText(this, texto, Toast.LENGTH_LONG).show();
              }

              // llamada de voz por WhatsApp.
              // WhatsApp guarda en los contactos del telefono una opcion "llamada de voz" por cada contacto que tiene WhatsApp.
              // Se busca esa opcion con el numero y se abre: asi la llamada sale sola.
              // Si el numero no esta guardado en los contactos, se abre el chat.
              private void llamarWhatsApp(String numero) {
                  if (checkSelfPermission(Manifest.permission.READ_CONTACTS) != PackageManager.PERMISSION_GRANTED) {
                      whatsappPorLlamar = numero;
                      requestPermissions(new String[]{Manifest.permission.READ_CONTACTS}, PERMISO_CONTACTOS);
                      return;
                  }
                  // se compara con los ultimos 8 digitos para no fallar por el +56 o el 9 de adelante
                  String fin = numero.length() > 8 ? numero.substring(numero.length() - 8) : numero;
                  String[] tipos = {
                      "vnd.android.cursor.item/vnd.com.whatsapp.voip.call",
                      "vnd.android.cursor.item/vnd.com.whatsapp.w4b.voip.call"
                  };
                  String[] paquetes = {"com.whatsapp", "com.whatsapp.w4b"};

                  for (int k = 0; k < tipos.length; k++) {
                      Cursor fila = null;
                      try {
                          fila = getContentResolver().query(
                              ContactsContract.Data.CONTENT_URI,
                              new String[]{ContactsContract.Data._ID},
                              ContactsContract.Data.MIMETYPE + " = ? AND " + ContactsContract.Data.DATA1 + " LIKE ?",
                              new String[]{tipos[k], "%" + fin + "@%"},
                              null);
                          if (fila != null && fila.moveToFirst()) {
                              long id = fila.getLong(0);
                              fila.close();
                              fila = null;
                              Intent llamada = new Intent(Intent.ACTION_VIEW);
                              llamada.setDataAndType(Uri.parse("content://com.android.contacts/data/" + id), tipos[k]);
                              llamada.setPackage(paquetes[k]);
                              if (abrir(llamada)) return;
                          }
                      } catch (Exception e) {
                          // seguir con la otra opcion
                      } finally {
                          if (fila != null) fila.close();
                      }
                  }
                  avisar("Guarda este número en los contactos del teléfono para llamar directo por WhatsApp. Por ahora se abre el chat.");
                  abrirWhatsApp(Uri.parse("https://wa.me/" + numero));
              }

              // primero intenta WhatsApp normal, despues WhatsApp Business, y si no hay ninguno el navegador
              private void abrirWhatsApp(Uri url) {
                  String numero = url.getPath() == null ? "" : url.getPath().replace("/", "");
                  String texto = url.getQueryParameter("text");
                  // sin numero (ej: cierre del dia) WhatsApp pregunta a quien mandarlo
                  String direccion = "https://api.whatsapp.com/send?";
                  if (numero.length() > 0) {
                      direccion += "phone=" + numero + "&";
                  }
                  if (texto != null && texto.length() > 0) {
                      // el mensaje queda escrito en el chat; el que envia es la persona
                      direccion += "text=" + Uri.encode(texto);
                  }
                  Uri directo = Uri.parse(direccion);
                  Intent normal = new Intent(Intent.ACTION_VIEW, directo);
                  normal.setPackage("com.whatsapp");
                  if (abrir(normal)) return;
                  Intent business = new Intent(Intent.ACTION_VIEW, directo);
                  business.setPackage("com.whatsapp.w4b");
                  if (abrir(business)) return;
                  abrir(new Intent(Intent.ACTION_VIEW, url));
              }

              private class Puente {
                  @JavascriptInterface
                  public void elegirContacto() {
                      // abre la agenda; solo se puede leer el contacto que se elija
                      final Intent i = new Intent(Intent.ACTION_PICK, ContactsContract.CommonDataKinds.Phone.CONTENT_URI);
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              try {
                                  startActivityForResult(i, CONTACTO);
                              } catch (Exception e) {
                                  llamarPantalla("archivoError()");
                              }
                          }
                      });
                  }

                  @JavascriptInterface
                  public void guardarArchivo(String nombre, String tipo, String contenido) {
                      contenidoPorGuardar = contenido;
                      final Intent i = new Intent(Intent.ACTION_CREATE_DOCUMENT);
                      i.addCategory(Intent.CATEGORY_OPENABLE);
                      i.setType(tipo);
                      i.putExtra(Intent.EXTRA_TITLE, nombre);
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              startActivityForResult(i, GUARDAR);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void abrirArchivo() {
                      final Intent i = new Intent(Intent.ACTION_OPEN_DOCUMENT);
                      i.addCategory(Intent.CATEGORY_OPENABLE);
                      i.setType("*/*");
                      runOnUiThread(new Runnable() {
                          @Override
                          public void run() {
                              startActivityForResult(i, ABRIR);
                          }
                      });
                  }
              }

              @Override
              protected void onActivityResult(int pedido, int resultado, Intent datos) {
                  super.onActivityResult(pedido, resultado, datos);

                  if (resultado != RESULT_OK || datos == null || datos.getData() == null) {
                      llamarPantalla(pedido == CONTACTO ? "contactoCancelado()" : "archivoCancelado()");
                      return;
                  }
                  Uri archivo = datos.getData();

                  try {
                      if (pedido == CONTACTO) {
                          String[] columnas = {
                              ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME,
                              ContactsContract.CommonDataKinds.Phone.NUMBER
                          };
                          Cursor fila = getContentResolver().query(archivo, columnas, null, null, null);
                          if (fila != null && fila.moveToFirst()) {
                              String nombre = fila.getString(0);
                              String numero = fila.getString(1);
                              fila.close();
                              llamarPantalla("contactoElegido(" + JSONObject.quote(nombre == null ? "" : nombre) + ", " + JSONObject.quote(numero == null ? "" : numero) + ")");
                          } else {
                              if (fila != null) fila.close();
                              llamarPantalla("contactoCancelado()");
                          }
                      } else if (pedido == GUARDAR) {
                          if (contenidoPorGuardar == null) {
                              llamarPantalla("archivoError()");
                              return;
                          }
                          OutputStream salida = getContentResolver().openOutputStream(archivo);
                          salida.write(contenidoPorGuardar.getBytes("UTF-8"));
                          salida.close();
                          contenidoPorGuardar = null;
                          llamarPantalla("archivoGuardado()");
                      } else if (pedido == ABRIR) {
                          InputStream entrada = getContentResolver().openInputStream(archivo);
                          ByteArrayOutputStream bytes = new ByteArrayOutputStream();
                          byte[] trozo = new byte[8192];
                          int leidos;
                          while ((leidos = entrada.read(trozo)) > 0) {
                              bytes.write(trozo, 0, leidos);
                          }
                          entrada.close();
                          String texto = bytes.toString("UTF-8");
                          llamarPantalla("recibirArchivo(" + JSONObject.quote(texto) + ")");
                      }
                  } catch (Exception e) {
                      llamarPantalla("archivoError()");
                  }
              }

              private void llamarPantalla(String codigo) {
                  web.evaluateJavascript(codigo, null);
              }

              @Override
              public void onBackPressed() {
                  if (web.canGoBack()) {
                      web.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          FIN_ARCHIVO
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/index.html <<'FIN_ARCHIVO'
          <!doctype html>
          <html lang="es">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
          <title>Contador de Bidones Poseidon</title>
          <style>
          /* una columna tipo app: resumen arriba, pestañas, contenido de cada pestaña */
          :root {
            --bg: #eef5f7;
            --card: #ffffff;
            --fg: #0f2a36;
            --muted: #557583;
            --line: #d3e3e9;
            --agua: #0b6e99;
            --agua-txt: #ffffff;
            --agua-suave: #d6ecf4;
            --peligro: #b3261e;
            --ok: #1d7a4a;
            --fuente: system-ui, "Roboto", sans-serif;
          }
          @media (prefers-color-scheme: dark) {
            :root {
              --bg: #0a1a21; --card: #11262f; --fg: #e3f1f6; --muted: #8fb0bd;
              --line: #21404c; --agua: #4fb8e3; --agua-txt: #06202b; --agua-suave: #15384a;
              --peligro: #ff8a80; --ok: #6fd39b;
              color-scheme: dark;
            }
          }
          * { box-sizing: border-box; }
          [hidden] { display: none !important; }
          html, body { margin: 0; }
          body {
            background: var(--bg); color: var(--fg);
            font-family: var(--fuente); font-size: 17px; line-height: 1.4;
          }
          .app { max-width: 480px; margin: 0 auto; padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 14px; }

          header h1 { margin: 0; font-size: 1.3rem; font-weight: 800; }
          header p { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }

          .resumen {
            background: var(--agua); color: var(--agua-txt);
            border-radius: 18px; padding: 16px 18px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px;
          }
          .resumen .lbl { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; opacity: 0.85; }
          .resumen .big { font-size: 1.9rem; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
          .resumen .sub { font-size: 1rem; font-weight: 700; font-variant-numeric: tabular-nums; }

          .tabs {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
            background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px;
            position: sticky; top: 0; z-index: 5;
          }
          .tabs button {
            border: 0; background: transparent; color: var(--muted);
            padding: 10px 2px; border-radius: 10px; font-size: 0.88rem; font-weight: 700; cursor: pointer;
            font-family: var(--fuente);
          }
          .tabs button.activo { background: var(--agua-suave); color: var(--fg); }

          .panel { display: flex; flex-direction: column; gap: 12px; }
          .caja {
            background: var(--card); border: 1px solid var(--line);
            border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px;
          }
          h2 { margin: 0; font-size: 1.1rem; }
          label { display: flex; flex-direction: column; gap: 4px; font-size: 0.9rem; color: var(--muted); font-weight: 700; }
          input[type=text], input[type=number], input[type=search] {
            height: 50px; padding: 0 12px; font-size: 1.05rem; font-family: var(--fuente);
            border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); width: 100%;
          }
          .fila2 { display: grid; grid-template-columns: 1fr; gap: 12px; }
          .stepper { display: flex; gap: 8px; }
          .stepper button {
            width: 50px; height: 50px; flex: none; border-radius: 12px; border: 1px solid var(--line);
            background: var(--agua-suave); color: var(--fg); font-size: 1.5rem; font-weight: 700; cursor: pointer;
          }
          .stepper input { text-align: center; font-weight: 800; font-size: 1.3rem; min-width: 0; flex: 1; padding: 0 4px; }
          .cliente-ok { font-size: 0.88rem; color: var(--ok); font-weight: 700; min-height: 1.2em; margin-top: -6px; }
          .total-venta {
            display: flex; justify-content: space-between; align-items: baseline;
            background: var(--agua-suave); border-radius: 12px; padding: 12px 14px;
          }
          .total-venta b { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
          .btn {
            height: 54px; border: 0; border-radius: 14px; background: var(--agua); color: var(--agua-txt);
            font-size: 1.1rem; font-weight: 800; cursor: pointer; font-family: var(--fuente);
          }
          .btn-sec {
            border: 1px solid var(--line); background: transparent; color: var(--fg);
            border-radius: 10px; padding: 8px 12px; font-size: 0.9rem; cursor: pointer; font-family: var(--fuente);
          }
          .btn-sec.peligro { color: var(--peligro); border-color: var(--peligro); font-weight: 700; }
          button:focus-visible, input:focus-visible { outline: 3px solid var(--agua); outline-offset: 2px; }
          .aviso { margin: 0; font-size: 0.92rem; color: var(--muted); min-height: 1.2em; }

          .cliente {
            background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
          }
          .cliente-cab {
            width: 100%; border: 0; background: transparent; color: var(--fg); text-align: left; cursor: pointer;
            padding: 14px 16px; display: flex; justify-content: space-between; gap: 10px; font-family: var(--fuente);
          }
          .cliente-cab .nom { font-weight: 800; font-size: 1.02rem; }
          .cliente-cab .dir { color: var(--muted); font-size: 0.88rem; }
          .cliente-cab .tot { text-align: right; font-variant-numeric: tabular-nums; max-width: 55%; }
          .cliente-cab .tot b { display: block; font-size: 1.05rem; }
          .cliente-cab .tot span { color: var(--muted); font-size: 0.85rem; display: block; }
          .cliente-det { border-top: 1px solid var(--line); }

          .dia { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; }
          .dia-cab {
            display: flex; justify-content: space-between; gap: 8px; padding: 12px 16px;
            background: var(--agua-suave); font-weight: 700;
          }
          .dia-cab span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
          .mov {
            display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-top: 1px solid var(--line);
          }
          .mov .info { flex: 1; min-width: 0; }
          .mov .info .quien { font-weight: 700; overflow-wrap: anywhere; }
          .mov .info .det { color: var(--muted); font-size: 0.88rem; font-variant-numeric: tabular-nums; }
          .mov .monto { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
          .ficha-cab { background: var(--agua); color: var(--agua-txt); border-radius: 18px; padding: 16px 18px; display: flex; flex-direction: column; gap: 2px; }
          .ficha-cab .nom { font-size: 1.3rem; font-weight: 800; overflow-wrap: anywhere; }
          .ficha-cab .dir { opacity: 0.85; font-size: 0.95rem; }
          .ficha-tots { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 12px; }
          .ficha-prod { margin-top: 8px; font-size: 0.92rem; font-weight: 700; }
          .ficha-tots span { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.85; }
          .ficha-tots b { font-size: 1.25rem; font-variant-numeric: tabular-nums; }
          .tabla-scroll { overflow-x: auto; }
          .resumen-tabla { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 0.88rem; }
          .resumen-tabla th { text-align: right; color: var(--muted); font-size: 0.78rem; font-weight: 700; padding: 8px 6px; }
          .resumen-tabla td { text-align: right; padding: 9px 6px; border-top: 1px solid var(--line); white-space: nowrap; }
          .resumen-tabla th:first-child, .resumen-tabla td:first-child { text-align: left; padding-left: 14px; }
          .resumen-tabla th:last-child, .resumen-tabla td:last-child { padding-right: 14px; }
          .resumen-tabla td:last-child { font-weight: 800; }
          .resumen-pie {
            grid-column: 1 / -1; border-top: 1px solid rgba(255,255,255,0.3); padding-top: 10px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
          }
          .resumen-pie b { display: block; font-size: 1.3rem; font-variant-numeric: tabular-nums; }
          .medios { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
          .medios .lbl { grid-column: 1 / -1; }
          .medios div { font-size: 0.78rem; opacity: 0.9; }
          .medios b { display: block; font-size: 1rem; opacity: 1; font-variant-numeric: tabular-nums; }
          .pago-lbl { font-size: 0.9rem; color: var(--muted); font-weight: 700; }
          .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
          .chip {
            height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--fg);
            font-size: 0.98rem; font-weight: 700; cursor: pointer; font-family: var(--fuente);
          }
          .chip.activo { background: var(--agua); border-color: var(--agua); color: var(--agua-txt); }
          .chip.pend.activo { background: var(--peligro); border-color: var(--peligro); color: #fff; }
          .etiqueta { display: inline-block; font-size: 0.75rem; font-weight: 800; padding: 2px 8px; border-radius: 999px; margin-top: 3px; background: var(--agua-suave); color: var(--fg); }
          .etiqueta.pend { background: var(--peligro); color: #fff; }
          .acciones { display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
          .btn-sec.cobrar { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 700; }
          .cobro { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px 14px; background: var(--agua-suave); }
          .cobro p { margin: 0; width: 100%; font-size: 0.88rem; font-weight: 700; }
          .cobro .chip { flex: 1 1 30%; height: 42px; }
          .debe { color: var(--peligro); font-weight: 800; font-size: 0.85rem; }
          .ficha-debe { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.3); display: flex; justify-content: space-between; align-items: baseline; }
          .ficha-debe b { font-size: 1.3rem; font-variant-numeric: tabular-nums; }
          .caja-cobro { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
          .vendido { grid-column: 1 / -1; width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 0.9rem; }
          .vendido th { text-align: right; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.85; font-weight: 700; padding: 0 0 6px 6px; }
          .vendido td { text-align: right; padding: 5px 0 5px 6px; border-top: 1px solid rgba(255,255,255,0.2); white-space: nowrap; }
          .vendido th:first-child, .vendido td:first-child { text-align: left; padding-left: 0; white-space: normal; }
          .vendido td.n { font-size: 1.15rem; font-weight: 800; }
          .vendido tr.suma td { font-weight: 800; border-top: 2px solid rgba(255,255,255,0.5); }
          .btn-otro { align-self: flex-start; }
          .ficha-extra { font-size: 0.9rem; opacity: 0.9; overflow-wrap: anywhere; }
          .ficha-btns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
          .ficha-btns a, .ficha-btns button {
            display: flex; align-items: center; justify-content: center; height: 44px; border-radius: 12px;
            border: 1px solid var(--line); background: var(--card); color: var(--fg); text-decoration: none;
            font-size: 0.95rem; font-weight: 700; font-family: var(--fuente); cursor: pointer;
          }
          .ficha-btns .wsp { background: #1f9d55; border-color: #1f9d55; color: #fff; }
          .ficha-btns .rojo { color: var(--peligro); border-color: var(--peligro); }
          .ficha-btns .ancho { grid-column: 1 / -1; }
          .ficha-btns .llamar { background: var(--agua); border-color: var(--agua); color: var(--agua-txt); }
          .ficha-btns .wsp-cobro { background: var(--card); border: 2px solid #1f9d55; color: var(--fg); }
          textarea {
            min-height: 70px; padding: 10px 12px; font-size: 1rem; font-family: var(--fuente); resize: vertical;
            border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); width: 100%;
          }
          input[type=tel] {
            height: 50px; padding: 0 12px; font-size: 1.05rem; font-family: var(--fuente);
            border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); width: 100%;
          }
          .confirmar { border: 2px solid var(--peligro); }
          .confirmar p { margin: 0; }
          .btn-rojo { background: var(--peligro); color: #fff; }
          .fila-btns { display: flex; flex-wrap: wrap; gap: 8px; }
          .fila-btns > * { flex: 1 1 140px; }
          .filtro { display: flex; gap: 8px; }
          .filtro .chip { flex: 1; height: 40px; font-size: 0.9rem; }
          .mini-debe { display: block; color: var(--peligro); font-size: 0.75rem; font-weight: 800; }
          .btn-sec2 {
            height: 48px; border-radius: 12px; border: 1px solid var(--agua); background: transparent; color: var(--fg);
            font-size: 1rem; font-weight: 700; cursor: pointer; font-family: var(--fuente);
          }
          .tel-fila { display: flex; gap: 8px; }
          .tel-fila input { flex: 1; min-width: 0; }
          .tel-fila button { flex: none; height: 50px; padding: 0 12px; }
          .carrito { display: flex; flex-direction: column; gap: 6px; }
          .grupo-lbl { font-size: 0.78rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-top: 6px; }
          .item {
            display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center;
            border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; background: var(--bg);
          }
          .item.con { border-color: var(--agua); background: var(--agua-suave); }
          .item .nom-prod { font-weight: 800; font-size: 0.98rem; }
          .item .precio-cu { display: flex; align-items: center; gap: 4px; font-size: 0.82rem; color: var(--muted); }
          .item .precio-cu input { width: 92px; height: 34px; font-size: 0.95rem; padding: 0 8px; }
          .item .paso { display: flex; align-items: center; gap: 6px; grid-row: span 2; }
          .item .paso button {
            width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
            color: var(--fg); font-size: 1.4rem; font-weight: 700; cursor: pointer;
          }
          .item .paso input { width: 52px; height: 42px; text-align: center; font-size: 1.15rem; font-weight: 800; padding: 0; }
          .item .sub-item { font-size: 0.82rem; font-weight: 700; color: var(--fg); min-height: 1em; }
          .detalle-total { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
          .mov.pedido { flex-wrap: wrap; }
          .lineas { flex-basis: 100%; order: 3; font-size: 0.88rem; color: var(--fg); font-variant-numeric: tabular-nums;
            border-top: 1px dashed var(--line); padding-top: 6px; display: flex; flex-direction: column; gap: 2px; }
          .lineas div { display: flex; justify-content: space-between; gap: 8px; }
          .lineas span:first-child { color: var(--muted); }
          .cierre p { margin: 0; white-space: pre-line; font-size: 0.92rem; font-variant-numeric: tabular-nums; }
          .wsp-btn {
            display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 12px;
            background: #1f9d55; color: #fff; text-decoration: none; font-weight: 800; font-size: 1rem;
          }
          .vacio { text-align: center; color: var(--muted); padding: 22px 16px; border: 1px dashed var(--line); border-radius: 16px; }
          </style>
          </head>
          <body>
          <div class="app">
            <header>
              <h1>Contador de Bidones Poseidon</h1>
              <p id="fechaHoy"></p>
            </header>

            <section class="resumen">
              <table class="vendido">
                <thead><tr><th>Vendido</th><th>Hoy</th><th>$ hoy</th><th>Total</th></tr></thead>
                <tbody id="tablaVendido"></tbody>
              </table>
              <div class="resumen-pie">
                <div><span class="lbl">Por cobrar (pendientes)</span><b id="porCobrar">$0</b></div>
                <div><span class="lbl">Vendido en total</span><b id="totPlata">$0</b></div>
              </div>
              <div class="medios">
                <span class="lbl">Cobrado hoy</span>
                <div>Efectivo<b id="hoyEfectivo">$0</b></div>
                <div>Transferencia<b id="hoyTransf">$0</b></div>
                <div>Tarjeta<b id="hoyTarjeta">$0</b></div>
              </div>
            </section>

            <nav class="tabs">
              <button type="button" data-tab="venta" class="activo">Venta</button>
              <button type="button" data-tab="clientes">Clientes</button>
              <button type="button" data-tab="historial">Historial</button>
              <button type="button" data-tab="ajustes">Ajustes</button>
            </nav>

            <!-- NUEVA VENTA -->
            <section class="panel" id="tab-venta">
              <div class="caja">
                <h2>Nueva venta</h2>
                <label>Nombre del cliente
                  <input type="text" id="nombre" list="listaNombres" autocomplete="off" placeholder="Ej: Don Juan">
                </label>
                <label>Dirección
                  <input type="text" id="direccion" list="listaDirecciones" autocomplete="off" placeholder="Ej: Los Aromos 123">
                </label>
                <label>Teléfono (opcional)
                  <div class="tel-fila">
                    <input type="tel" id="telefono" inputmode="tel" autocomplete="off" placeholder="Ej: 9 1234 5678">
                    <button type="button" class="btn-sec2 btn-contactos" id="btnContactoVenta">Contactos</button>
                  </div>
                </label>
                <div class="cliente-ok" id="clienteOk"></div>
                <datalist id="listaNombres"></datalist>
                <datalist id="listaDirecciones"></datalist>

                <div>
                  <span class="pago-lbl">¿Qué vendió? (puede elegir varios)</span>
                  <div class="carrito" id="carrito"></div>
                </div>

                <div>
                  <div class="total-venta">
                    <span>Total a cobrar</span>
                    <b id="totalVenta">$0</b>
                  </div>
                  <div class="detalle-total" id="detalleTotal"></div>
                </div>

                <div>
                  <span class="pago-lbl">¿Cómo pagó?</span>
                  <div class="chips" id="chipsPago">
                    <button type="button" class="chip activo" data-pago="efectivo">Efectivo</button>
                    <button type="button" class="chip" data-pago="transferencia">Transferencia</button>
                    <button type="button" class="chip" data-pago="tarjeta">Tarjeta</button>
                    <button type="button" class="chip pend" data-pago="pendiente">Pendiente</button>
                  </div>
                </div>

                <button type="button" class="btn" id="btnGuardar">Guardar venta</button>
                <p class="aviso" id="avisoVenta"></p>
                <div id="trasGuardar"></div>
              </div>
            </section>

            <!-- CLIENTES -->
            <section class="panel" id="tab-clientes" hidden>
              <input type="search" id="buscar" placeholder="Buscar por nombre, dirección o teléfono">
              <div class="filtro" id="filtros">
                <button type="button" class="chip activo" id="filtroTodos">Todos</button>
                <button type="button" class="chip" id="filtroDeben">Solo los que deben</button>
              </div>
              <div id="listaClientes" class="panel"></div>
            </section>

            <!-- HISTORIAL -->
            <section class="panel" id="tab-historial" hidden>
              <div class="caja cierre" id="cajaCierre">
                <h2>Cierre de hoy</h2>
                <p id="textoCierre"></p>
                <a class="wsp-btn" id="btnCierre" href="#">Enviar cierre por WhatsApp</a>
              </div>
              <div id="listaHistorial" class="panel"></div>
            </section>

            <!-- AJUSTES -->
            <section class="panel" id="tab-ajustes" hidden>
              <div class="caja">
                <h2>Precios (CLP)</h2>
                <p class="aviso">Estos precios aparecen solos en cada venta (igual se pueden cambiar en la venta).</p>
                <span class="grupo-lbl">Recarga de agua</span>
                <label>Precio del bidón de 20 litros
                  <input type="number" id="precio_b20" inputmode="numeric" min="0">
                </label>
                <label>Precio del bidón de 10 litros
                  <input type="number" id="precio_b10" inputmode="numeric" min="0">
                </label>
                <span class="grupo-lbl">Venta de bidón nuevo</span>
                <label>Precio del bidón nuevo de 20 litros
                  <input type="number" id="precio_n20" inputmode="numeric" min="0">
                </label>
                <label>Precio del bidón nuevo de 10 litros
                  <input type="number" id="precio_n10" inputmode="numeric" min="0">
                </label>
                <span class="grupo-lbl">Dispensadores</span>
                <label>Precio del dispensador USB
                  <input type="number" id="precio_dusb" inputmode="numeric" min="0">
                </label>
                <label>Precio del dispensador básico
                  <input type="number" id="precio_dbas" inputmode="numeric" min="0">
                </label>
                <button type="button" class="btn" id="btnPrecio">Guardar precios</button>
                <p class="aviso" id="avisoPrecio"></p>
              </div>
              <div class="caja" id="cajaRespaldo">
                <h2>Respaldo</h2>
                <p class="aviso">Los datos viven solo en este teléfono. Guarda un respaldo seguido (en Drive o en el teléfono) para no perder nada si el teléfono se pierde o se cambia.</p>
                <p class="aviso" id="ultimoRespaldo"></p>
                <button type="button" class="btn" id="btnRespaldo">Guardar respaldo</button>
                <button type="button" class="btn-sec2" id="btnRecuperar">Recuperar desde un respaldo</button>
                <div id="confirmarRecuperar"></div>
                <p class="aviso" id="avisoRespaldo"></p>
              </div>
              <div class="caja" id="cajaExcel">
                <h2>Exportar a Excel</h2>
                <p class="aviso">Crea un archivo con todas las ventas (fecha, cliente, producto, cantidad, precio, pago) que se abre en Excel o Google Sheets.</p>
                <button type="button" class="btn-sec2" id="btnExcel">Exportar ventas a Excel</button>
              </div>
              <div class="caja">
                <h2>Importante</h2>
                <p class="aviso">Si se desinstala la app, se borran los datos del teléfono (por eso el respaldo). Para actualizarla, instala la versión nueva encima.</p>
              </div>
            </section>
          </div>

          <script>
          // ===================== DATOS =====================
          let clientes = [];   // { id, nombre, direccion }
          let ventas = [];     // { id, clienteId, producto, cantidad, precio, ts, pago, fechaPago }

          // productos que vende
          // grupo: recarga (agua), nuevo (bidon nuevo con agua), disp (dispensadores)
          const PRODUCTOS = {
            b20:  { nombre: "Bidón 20 L",         corto: "bid. 20 L",       grupo: "recarga", precioTxt: "Precio del bidón de 20 litros",
                    uno: "bidón de 20 litros", varios: "bidones de 20 litros" },
            b10:  { nombre: "Bidón 10 L",         corto: "bid. 10 L",       grupo: "recarga", precioTxt: "Precio del bidón de 10 litros",
                    uno: "bidón de 10 litros", varios: "bidones de 10 litros" },
            n20:  { nombre: "Bidón nuevo 20 L",   corto: "bid. nuevo 20 L", grupo: "nuevo",   precioTxt: "Precio del bidón nuevo de 20 litros",
                    uno: "bidón nuevo de 20 litros", varios: "bidones nuevos de 20 litros" },
            n10:  { nombre: "Bidón nuevo 10 L",   corto: "bid. nuevo 10 L", grupo: "nuevo",   precioTxt: "Precio del bidón nuevo de 10 litros",
                    uno: "bidón nuevo de 10 litros", varios: "bidones nuevos de 10 litros" },
            dusb: { nombre: "Dispensador USB",    corto: "disp. USB",       grupo: "disp",    precioTxt: "Precio del dispensador USB",
                    uno: "dispensador USB", varios: "dispensadores USB" },
            dbas: { nombre: "Dispensador básico", corto: "disp. básico",    grupo: "disp",    precioTxt: "Precio del dispensador básico",
                    uno: "dispensador básico", varios: "dispensadores básicos" }
          };
          const ORDEN = ["b20", "b10", "n20", "n10", "dusb", "dbas"];
          const GRUPOS = [["recarga", "Recarga de agua"], ["nuevo", "Venta de bidón nuevo"], ["disp", "Dispensadores"]];
          let precios = { b20: 0, b10: 0, n20: 0, n10: 0, dusb: 0, dbas: 0 };
          let carrito = {};   // lo que se esta vendiendo: { b20: { cant, precio }, ... }
          let borrarPendiente = null;
          let pagoElegido = "efectivo";
          let cobrando = null;   // id de la venta que se esta cobrando, o "todo:" + id del cliente
          const MEDIOS = { efectivo: "Efectivo", transferencia: "Transferencia", tarjeta: "Tarjeta", pendiente: "Pendiente" };
          let clienteAbierto = null;
          let editandoCliente = null;   // id del cliente que se esta editando
          let borrandoCliente = null;   // id del cliente que se quiere eliminar
          let soloDeudores = false;
          let respaldoPorRecuperar = null;
          let avisoFicha = "";
          let contactoPara = "";   // "venta" o "editar": donde poner el contacto elegido

          const $ = (id) => document.getElementById(id);

          function cargar() {
            try {
              clientes = JSON.parse(localStorage.getItem("cb_clientes") || "[]");
              ventas = JSON.parse(localStorage.getItem("cb_ventas") || "[]");
              const guardados = JSON.parse(localStorage.getItem("cb_precios") || "null");
              if (guardados) {
                ORDEN.forEach(p => { precios[p] = Number(guardados[p]) || 0; });
              } else {
                // version anterior: un solo precio, que era el del bidon de 20
                precios.b20 = Number(localStorage.getItem("cb_precio") || 0);
              }

              // pasar los registros de la version anterior (solo contador) si existen
              const viejos = JSON.parse(localStorage.getItem("bidones") || "[]");
              if (viejos.length > 0 && ventas.length === 0) {
                const c = { id: "c" + Date.now(), nombre: "Sin cliente", direccion: "" };
                clientes.push(c);
                viejos.forEach(v => ventas.push({ id: "v" + v.ts + Math.random().toString(36).slice(2, 6), clienteId: c.id, cantidad: v.cantidad, precio: 0, ts: v.ts }));
                localStorage.removeItem("bidones");
                guardar();
              }
            } catch (e) {
              clientes = []; ventas = [];
            }
          }

          function guardar() {
            try {
              localStorage.setItem("cb_clientes", JSON.stringify(clientes));
              localStorage.setItem("cb_ventas", JSON.stringify(ventas));
              localStorage.setItem("cb_precios", JSON.stringify(precios));
            } catch (e) {}
          }

          // ===================== AYUDAS =====================
          // pesos chilenos, sin decimales: $12.500
          function plata(n) {
            return "$" + Math.round(n).toLocaleString("es-CL");
          }
          function esPendiente(v) {
            return v.pago === "pendiente";
          }
          // las ventas antiguas no tenian producto: eran bidones de 20
          function prod(v) {
            return PRODUCTOS[v.producto] ? v.producto : "b20";
          }
          function cuentaVacia() {
            const c = {};
            ORDEN.forEach(p => { c[p] = 0; });
            return c;
          }
          // "3 bidones de 20 litros"
          function nombreCant(p, n) {
            return n + " " + (n === 1 ? PRODUCTOS[p].uno : PRODUCTOS[p].varios);
          }
          // junta las ventas de un mismo pedido (las antiguas no tienen pedido: cada una es su propio pedido)
          function agruparPedidos(lista) {
            const grupos = {};
            const orden = [];
            lista.forEach(v => {
              const k = v.pedidoId || v.id;
              if (!grupos[k]) { grupos[k] = []; orden.push(k); }
              grupos[k].push(v);
            });
            return orden.map(k => grupos[k]).sort((a, b) => b[0].ts - a[0].ts);
          }
          function clavePedido(grupo) {
            return grupo[0].pedidoId || grupo[0].id;
          }
          function totalGrupo(grupo) {
            return grupo.reduce((s, v) => s + v.cantidad * v.precio, 0);
          }
          // ej: "15 bid. 20 L · 2 disp. USB"
          function textoUnidades(cuenta) {
            const partes = ORDEN.filter(p => cuenta[p] > 0).map(p => cuenta[p] + " " + PRODUCTOS[p].corto);
            return partes.length ? partes.join(" · ") : "sin compras";
          }
          function claveDia(ts) {
            const d = new Date(ts);
            return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
          }
          function normal(txt) {
            return (txt || "").trim().toLowerCase();
          }
          // telefono chileno a formato internacional: 9 1234 5678 -> 56912345678
          function telInternacional(tel) {
            let d = (tel || "").replace(/\D/g, "");
            if (d.length === 9 && d.charAt(0) === "9") d = "56" + d;
            if (d.length === 8) d = "569" + d;
            return d;
          }
          function nombreDe(c) {
            if (!c) return "Cliente borrado";
            return c.nombre || c.direccion || "Sin nombre";
          }
          function buscarCliente(nombre, direccion) {
            const n = normal(nombre), d = normal(direccion);
            if (n) {
              const porNombre = clientes.find(c => normal(c.nombre) === n);
              if (porNombre) return porNombre;
            }
            if (d) {
              const porDir = clientes.find(c => normal(c.direccion) === d);
              if (porDir) return porDir;
            }
            return null;
          }
          function totalesCliente(id) {
            let b = 0, p = 0, ultimo = 0, deuda = 0;
            const porProd = cuentaVacia();
            ventas.forEach(v => {
              if (v.clienteId === id) {
                b += v.cantidad; p += v.cantidad * v.precio;
                porProd[prod(v)] += v.cantidad;
                if (esPendiente(v)) deuda += v.cantidad * v.precio;
                if (v.ts > ultimo) ultimo = v.ts;
              }
            });
            return { unidades: b, plata: p, ultimo: ultimo, deuda: deuda, porProd: porProd };
          }

          // marca ventas como pagadas con el medio que se elija en ese momento
          function cobrar(lista, medio) {
            const ahora = Date.now();
            lista.forEach(v => { v.pago = medio; v.fechaPago = ahora; });
            cobrando = null;
            guardar();
            todo();
          }

          function opcionesCobro(texto) {
            const caja = document.createElement("div");
            caja.className = "cobro";
            caja.innerHTML = "<p></p>";
            caja.querySelector("p").textContent = texto;
            return caja;
          }
          function botonesCobro(caja, alElegir) {
            ["efectivo", "transferencia", "tarjeta"].forEach(m => {
              const b = document.createElement("button");
              b.type = "button"; b.className = "chip"; b.textContent = MEDIOS[m];
              b.onclick = (e) => { e.stopPropagation(); alElegir(m); };
              caja.appendChild(b);
            });
            const cancelar = document.createElement("button");
            cancelar.type = "button"; cancelar.className = "btn-sec"; cancelar.textContent = "Cancelar";
            cancelar.onclick = (e) => { e.stopPropagation(); cobrando = null; todo(); };
            caja.appendChild(cancelar);
          }
          function nombreDia(clave) {
            if (clave === claveDia(Date.now())) return "Hoy";
            if (clave === claveDia(Date.now() - 86400000)) return "Ayer";
            const [y, m, d] = clave.split("-").map(Number);
            const txt = new Date(y, m - 1, d).toLocaleDateString("es-CL", { weekday: "long", day: "numeric", month: "short", year: "numeric" });
            return txt.charAt(0).toUpperCase() + txt.slice(1);
          }

          // ===================== RESUMEN =====================
          function dibujarResumen() {
            const hoy = claveDia(Date.now());
            const hoyCant = cuentaVacia(), hoyPlata = cuentaVacia(), totCant = cuentaVacia();
            let tp = 0;
            ventas.forEach(v => {
              const p = prod(v);
              totCant[p] += v.cantidad;
              tp += v.cantidad * v.precio;
              if (claveDia(v.ts) === hoy) { hoyCant[p] += v.cantidad; hoyPlata[p] += v.cantidad * v.precio; }
            });

            // tabla: cada producto vendido hoy, plata de hoy y total acumulado
            const tabla = $("tablaVendido");
            tabla.innerHTML = "";
            let sh = 0, sp = 0, st = 0;
            ORDEN.forEach(p => {
              const tr = document.createElement("tr");
              tr.innerHTML = '<td></td><td class="n"></td><td></td><td></td>';
              const td = tr.querySelectorAll("td");
              td[0].textContent = PRODUCTOS[p].nombre;
              td[1].textContent = hoyCant[p];
              td[2].textContent = plata(hoyPlata[p]);
              td[3].textContent = totCant[p];
              tabla.appendChild(tr);
              sh += hoyCant[p]; sp += hoyPlata[p]; st += totCant[p];
            });
            const suma = document.createElement("tr");
            suma.className = "suma";
            suma.innerHTML = '<td>Total</td><td class="n"></td><td></td><td></td>';
            const tds = suma.querySelectorAll("td");
            tds[1].textContent = sh; tds[2].textContent = plata(sp); tds[3].textContent = st;
            tabla.appendChild(suma);
            $("totPlata").textContent = plata(tp);

            // lo que falta por cobrar y lo cobrado hoy por medio de pago
            let deuda = 0;
            const hoyMedio = { efectivo: 0, transferencia: 0, tarjeta: 0 };
            ventas.forEach(v => {
              const monto = v.cantidad * v.precio;
              if (esPendiente(v)) { deuda += monto; return; }
              const fp = v.fechaPago || v.ts;
              if (claveDia(fp) === hoy && hoyMedio[v.pago] !== undefined) hoyMedio[v.pago] += monto;
            });
            $("porCobrar").textContent = plata(deuda);
            $("hoyEfectivo").textContent = plata(hoyMedio.efectivo);
            $("hoyTransf").textContent = plata(hoyMedio.transferencia);
            $("hoyTarjeta").textContent = plata(hoyMedio.tarjeta);
          }

          // ===================== VENTA =====================
          function llenarSugerencias() {
            $("listaNombres").innerHTML = "";
            $("listaDirecciones").innerHTML = "";
            clientes.forEach(c => {
              if (c.nombre) { const o = document.createElement("option"); o.value = c.nombre; $("listaNombres").appendChild(o); }
              if (c.direccion) { const o = document.createElement("option"); o.value = c.direccion; $("listaDirecciones").appendChild(o); }
            });
          }

          function revisarCliente(desde) {
            const c = buscarCliente(
              desde === "nombre" ? $("nombre").value : "",
              desde === "direccion" ? $("direccion").value : ""
            );
            if (c) {
              if (desde === "nombre" && c.direccion && !$("direccion").value.trim()) $("direccion").value = c.direccion;
              if (desde === "direccion" && c.nombre && !$("nombre").value.trim()) $("nombre").value = c.nombre;
              if (c.telefono && !$("telefono").value.trim()) $("telefono").value = c.telefono;
              const t = totalesCliente(c.id);
              $("clienteOk").textContent = "Cliente registrado: lleva " + textoUnidades(t.porProd) + " (" + plata(t.plata) + ")" + (t.deuda > 0 ? " · DEBE " + plata(t.deuda) : "");
            } else if ($("nombre").value.trim() || $("direccion").value.trim()) {
              $("clienteOk").textContent = "Cliente nuevo: se guardará al registrar la venta";
            } else {
              $("clienteOk").textContent = "";
            }
          }

          // arma la lista de productos con su cantidad y precio
          function nuevoCarrito() {
            carrito = {};
            ORDEN.forEach(p => { carrito[p] = { cant: 0, precio: precios[p] || 0 }; });
            dibujarCarrito();
          }

          function dibujarCarrito() {
            const caja = $("carrito");
            caja.innerHTML = "";
            GRUPOS.forEach(([grupo, titulo]) => {
              const lbl = document.createElement("span");
              lbl.className = "grupo-lbl";
              lbl.textContent = titulo;
              caja.appendChild(lbl);
              ORDEN.filter(p => PRODUCTOS[p].grupo === grupo).forEach(p => {
                const it = document.createElement("div");
                it.className = "item" + (carrito[p].cant > 0 ? " con" : "");
                it.innerHTML =
                  '<div class="nom-prod"></div>' +
                  '<div class="paso"><button type="button" class="menos" aria-label="Restar">−</button><input type="number" inputmode="numeric" min="0" class="cant"><button type="button" class="mas" aria-label="Sumar">+</button></div>' +
                  '<div class="precio-cu">c/u $<input type="number" inputmode="numeric" min="0" class="pre"></div>' +
                  '<div class="sub-item"></div>';
                it.querySelector(".nom-prod").textContent = PRODUCTOS[p].nombre;
                const inCant = it.querySelector(".cant");
                const inPre = it.querySelector(".pre");
                inCant.value = carrito[p].cant || "";
                inCant.placeholder = "0";
                inPre.value = carrito[p].precio || "";
                inPre.setAttribute("aria-label", PRODUCTOS[p].precioTxt);
                const pintar = () => {
                  it.classList.toggle("con", carrito[p].cant > 0);
                  it.querySelector(".sub-item").textContent = carrito[p].cant > 0 ? "= " + plata(carrito[p].cant * carrito[p].precio) : "";
                  calcularTotal();
                };
                it.querySelector(".menos").onclick = () => { carrito[p].cant = Math.max(0, carrito[p].cant - 1); inCant.value = carrito[p].cant || ""; pintar(); };
                it.querySelector(".mas").onclick = () => { carrito[p].cant += 1; inCant.value = carrito[p].cant; pintar(); };
                inCant.oninput = () => { carrito[p].cant = Math.max(0, parseInt(inCant.value, 10) || 0); pintar(); };
                inPre.oninput = () => { carrito[p].precio = Math.max(0, parseInt(inPre.value, 10) || 0); pintar(); };
                caja.appendChild(it);
                pintar();
              });
            });
          }

          function calcularTotal() {
            let total = 0;
            const partes = [];
            ORDEN.forEach(p => {
              if (carrito[p] && carrito[p].cant > 0) {
                total += carrito[p].cant * carrito[p].precio;
                partes.push(nombreCant(p, carrito[p].cant));
              }
            });
            $("totalVenta").textContent = plata(total);
            $("detalleTotal").textContent = partes.join(" + ");
          }

          document.querySelectorAll("#chipsPago .chip").forEach(b => {
            b.onclick = () => {
              pagoElegido = b.dataset.pago;
              document.querySelectorAll("#chipsPago .chip").forEach(x => x.classList.toggle("activo", x === b));
            };
          });

          function elegirPago(medio) {
            pagoElegido = medio;
            document.querySelectorAll("#chipsPago .chip").forEach(x => x.classList.toggle("activo", x.dataset.pago === medio));
          }

          $("nombre").addEventListener("input", () => { $("trasGuardar").innerHTML = ""; revisarCliente("nombre"); });
          $("direccion").addEventListener("input", () => revisarCliente("direccion"));

          // texto del comprobante de un pedido
          function textoComprobante(grupo, c) {
            const d = new Date(grupo[0].ts);
            let txt = "*Agua Poseidon* - Comprobante de pedido\n";
            txt += "Cliente: " + (c ? nombreDe(c) : "") + "\n";
            txt += "Fecha: " + d.toLocaleDateString("es-CL") + " " + d.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" }) + "\n\n";
            grupo.forEach(v => {
              txt += "- " + v.cantidad + " x " + PRODUCTOS[prod(v)].nombre + " a " + plata(v.precio) + " = " + plata(v.cantidad * v.precio) + "\n";
            });
            txt += "\n*Total: " + plata(totalGrupo(grupo)) + "*\n";
            const pend = grupo.some(esPendiente);
            txt += pend ? "Estado: pendiente de pago" : "Pagado con " + (MEDIOS[grupo[0].pago] || "").toLowerCase();
            txt += "\n\n¡Gracias por su compra!";
            return txt;
          }
          function linkComprobante(grupo, c) {
            const tel = c ? telInternacional(c.telefono) : "";
            if (!tel) return null;
            const a = document.createElement("a");
            a.href = "https://wa.me/" + tel + "?text=" + encodeURIComponent(textoComprobante(grupo, c));
            return a;
          }

          $("btnGuardar").onclick = () => {
            const nombre = $("nombre").value.trim();
            const direccion = $("direccion").value.trim();
            const lineas = ORDEN.filter(p => carrito[p].cant > 0);

            if (!nombre && !direccion) { $("avisoVenta").textContent = "Escribe el nombre o la dirección del cliente."; return; }
            if (lineas.length === 0) { $("avisoVenta").textContent = "Elige al menos un producto (toca + en lo que vendió)."; return; }
            const sinPrecio = lineas.find(p => !carrito[p].precio);
            if (sinPrecio) { $("avisoVenta").textContent = "Falta el " + PRODUCTOS[sinPrecio].precioTxt.toLowerCase() + "."; return; }

            const telefono = $("telefono").value.trim();
            let c = buscarCliente(nombre, direccion);
            if (!c) {
              c = { id: "c" + Date.now(), nombre: nombre, direccion: direccion, telefono: telefono };
              clientes.push(c);
            } else {
              if (telefono) c.telefono = telefono;
              // si faltaba algun dato del cliente, se completa
              if (!c.nombre && nombre) c.nombre = nombre;
              if (direccion && normal(c.direccion) !== normal(direccion)) c.direccion = direccion;
            }

            // un pedido = una venta por cada producto, todas con el mismo pedidoId
            const ahora = Date.now();
            const pedidoId = "p" + ahora;
            const grupo = [];
            lineas.forEach(p => {
              const v = {
                id: "v" + ahora + "_" + p, pedidoId: pedidoId, clienteId: c.id, producto: p,
                cantidad: carrito[p].cant, precio: carrito[p].precio, ts: ahora,
                pago: pagoElegido, fechaPago: pagoElegido === "pendiente" ? null : ahora
              };
              ventas.push(v);
              grupo.push(v);
            });
            guardar();

            const t = totalesCliente(c.id);
            $("avisoVenta").textContent = "Pedido guardado: " + lineas.map(p => nombreCant(p, carrito[p].cant)).join(", ") +
              " a " + nombreDe(c) + " por " + plata(totalGrupo(grupo)) + " (" + MEDIOS[pagoElegido] + "). En total lleva " +
              textoUnidades(t.porProd) + " (" + plata(t.plata) + ")" + (t.deuda > 0 ? " y debe " + plata(t.deuda) : "") + ".";

            // boton para mandarle el comprobante al cliente
            $("trasGuardar").innerHTML = "";
            const comp = linkComprobante(grupo, c);
            if (comp) {
              comp.className = "wsp-btn";
              comp.textContent = "Enviar comprobante por WhatsApp";
              $("trasGuardar").appendChild(comp);
            }

            $("nombre").value = ""; $("direccion").value = ""; $("telefono").value = "";
            $("clienteOk").textContent = "";
            nuevoCarrito();
            elegirPago("efectivo");
            todo();
          };

          // ===================== CLIENTES =====================
          // una fila por pedido, con el detalle de cada producto
          function filaPedido(grupo, mostrarCliente) {
            const v0 = grupo[0];
            const clave = clavePedido(grupo);
            const cont = document.createElement("div");
            const fila = document.createElement("div");
            fila.className = "mov pedido";
            cont.appendChild(fila);
            const c = clientes.find(x => x.id === v0.clienteId);
            const hora = new Date(v0.ts).toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" });
            const fecha = new Date(v0.ts).toLocaleDateString("es-CL", { day: "numeric", month: "short", year: "numeric" });
            const total = totalGrupo(grupo);

            fila.innerHTML = '<div class="info"><div class="quien"></div><div class="det"></div><span class="etiqueta"></span></div><span class="monto"></span><div class="acciones"></div><div class="lineas"></div>';
            const quien = c ? nombreDe(c) : (v0.nombreBorrado ? v0.nombreBorrado + " (borrado)" : "Cliente borrado");
            fila.querySelector(".quien").textContent = mostrarCliente ? quien : fecha;
            const unidades = grupo.reduce((n, v) => n + v.cantidad, 0);
            fila.querySelector(".det").textContent = hora + " · " + (grupo.length > 1 ? grupo.length + " productos, " + unidades + " unid." : "1 producto");
            const lin = fila.querySelector(".lineas");
            grupo.forEach(v => {
              const d = document.createElement("div");
              d.innerHTML = "<span></span><span></span>";
              d.children[0].textContent = v.cantidad + " × " + PRODUCTOS[prod(v)].nombre + " (" + plata(v.precio) + " c/u)";
              d.children[1].textContent = plata(v.cantidad * v.precio);
              lin.appendChild(d);
            });
            fila.querySelector(".monto").textContent = plata(total);

            const pendientes = grupo.filter(esPendiente);
            const etq = fila.querySelector(".etiqueta");
            if (pendientes.length > 0) {
              etq.textContent = "Pendiente de pago";
              etq.classList.add("pend");
            } else if (v0.pago) {
              let txt = MEDIOS[v0.pago] || "Pagado";
              if (v0.fechaPago && claveDia(v0.fechaPago) !== claveDia(v0.ts)) {
                txt += " · pagó el " + new Date(v0.fechaPago).toLocaleDateString("es-CL", { day: "numeric", month: "short" });
              }
              etq.textContent = txt;
            } else {
              etq.textContent = "Pagado";
            }

            const acc = fila.querySelector(".acciones");
            if (pendientes.length > 0) {
              const bc = document.createElement("button");
              bc.type = "button"; bc.className = "btn-sec cobrar"; bc.textContent = "Cobrar";
              bc.onclick = (e) => { e.stopPropagation(); cobrando = clave; borrarPendiente = null; todo(); };
              acc.appendChild(bc);
            }
            if (!mostrarCliente) {
              const comp = linkComprobante(grupo, c);
              if (comp) {
                comp.className = "btn-sec";
                comp.style.textDecoration = "none";
                comp.style.textAlign = "center";
                comp.textContent = "Enviar";
                acc.appendChild(comp);
              }
            }
            const btn = document.createElement("button");
            btn.type = "button"; btn.className = "btn-sec";
            if (borrarPendiente === clave) {
              btn.textContent = "¿Borrar?";
              btn.classList.add("peligro");
              btn.onclick = (e) => {
                e.stopPropagation();
                const ids = grupo.map(x => x.id);
                ventas = ventas.filter(x => !ids.includes(x.id));
                borrarPendiente = null; guardar(); todo();
              };
            } else {
              btn.textContent = "Borrar";
              btn.onclick = (e) => { e.stopPropagation(); borrarPendiente = clave; cobrando = null; todo(); };
            }
            acc.appendChild(btn);

            if (cobrando === clave) {
              const deuda = totalGrupo(pendientes);
              const caja = opcionesCobro("¿Cómo pagó " + plata(deuda) + "?");
              botonesCobro(caja, (m) => cobrar(pendientes, m));
              cont.appendChild(caja);
            }
            return cont;
          }

          function dibujarClientes() {
            const lista = $("listaClientes");
            lista.innerHTML = "";

            // si hay un cliente abierto se muestra su ficha completa
            if (clienteAbierto && clientes.find(c => c.id === clienteAbierto)) {
              $("buscar").hidden = true;
              $("filtros").hidden = true;
              dibujarFicha(lista, clientes.find(c => c.id === clienteAbierto));
              return;
            }
            clienteAbierto = null;
            $("buscar").hidden = false;
            $("filtros").hidden = false;
            const q = normal($("buscar").value);

            let datos = clientes
              .filter(c => !q || normal(c.nombre).includes(q) || normal(c.direccion).includes(q) || (c.telefono || "").replace(/\D/g, "").includes(q.replace(/\D/g, "") || "x"))
              .map(c => ({ c: c, t: totalesCliente(c.id) }));

            const cuantosDeben = datos.filter(d => d.t.deuda > 0).length;
            $("filtroDeben").textContent = "Solo los que deben (" + cuantosDeben + ")";

            if (soloDeudores) {
              // los que deben, primero el que debe mas
              datos = datos.filter(d => d.t.deuda > 0).sort((a, b) => b.t.deuda - a.t.deuda);
            } else {
              datos.sort((a, b) => b.t.ultimo - a.t.ultimo);
            }

            if (datos.length === 0) {
              let txt = "Todavía no hay clientes.<br>Se agregan solos al guardar una venta.";
              if (soloDeudores) txt = "Nadie debe. Todos están al día.";
              else if (q) txt = "No hay clientes con esa búsqueda.";
              lista.innerHTML = '<div class="vacio">' + txt + '</div>';
              return;
            }

            datos.forEach(({ c, t }) => {
              const caja = document.createElement("div");
              caja.className = "cliente";
              caja.innerHTML = '<button type="button" class="cliente-cab"><div><div class="nom"></div><div class="dir"></div></div><div class="tot"><b></b><span></span></div></button>';
              caja.querySelector(".nom").textContent = nombreDe(c);
              caja.querySelector(".dir").textContent = c.nombre ? (c.direccion || "Sin dirección") : "";
              caja.querySelector(".tot b").textContent = plata(t.plata);
              caja.querySelector(".tot span").textContent = textoUnidades(t.porProd) + " ›";
              if (t.deuda > 0) {
                const d = document.createElement("div");
                d.className = "debe";
                d.textContent = "Debe " + plata(t.deuda);
                caja.querySelector(".tot").appendChild(d);
              }
              caja.querySelector(".cliente-cab").onclick = () => { clienteAbierto = c.id; borrarPendiente = null; dibujarClientes(); window.scrollTo(0, 0); };
              lista.appendChild(caja);
            });
          }

          // ficha del cliente: totales, resumen por mes y por año, y cada pedido
          function dibujarFicha(lista, c) {
            const susVentas = ventas.filter(v => v.clienteId === c.id).sort((a, b) => b.ts - a.ts);
            const t = totalesCliente(c.id);

            const volver = document.createElement("button");
            volver.type = "button";
            volver.className = "btn-sec";
            volver.textContent = "‹ Volver a clientes";
            volver.style.alignSelf = "flex-start";
            volver.onclick = () => { cerrarFicha(); dibujarClientes(); };
            lista.appendChild(volver);

            // cabecera con totales
            const cab = document.createElement("div");
            cab.className = "ficha-cab";
            cab.innerHTML = '<div class="nom"></div><div class="dir"></div>' +
              '<div class="ficha-tots"><div><span>Pedidos</span><b class="p"></b></div><div><span>Total $</span><b class="m"></b></div></div><div class="ficha-prod"></div>';
            cab.querySelector(".nom").textContent = nombreDe(c);
            cab.querySelector(".dir").textContent = c.nombre ? (c.direccion || "Sin dirección") : "";
            const susPedidos = agruparPedidos(susVentas);
            cab.querySelector(".p").textContent = susPedidos.length;
            cab.querySelector(".ficha-prod").textContent = textoUnidades(t.porProd);
            cab.querySelector(".m").textContent = plata(t.plata);
            const debe = document.createElement("div");
            debe.className = "ficha-debe";
            debe.innerHTML = "<span>Debe</span><b></b>";
            debe.querySelector("b").textContent = t.deuda > 0 ? plata(t.deuda) : "$0 (al día)";
            cab.appendChild(debe);
            if (c.telefono || c.notas) {
              const extra = document.createElement("div");
              extra.className = "ficha-extra";
              extra.textContent = (c.telefono ? "Tel: " + c.telefono : "") + (c.telefono && c.notas ? " · " : "") + (c.notas ? "Nota: " + c.notas : "");
              cab.insertBefore(extra, cab.querySelector(".ficha-tots"));
            }
            lista.appendChild(cab);

            if (avisoFicha) {
              const av = document.createElement("p");
              av.className = "aviso";
              av.textContent = avisoFicha;
              lista.appendChild(av);
              avisoFicha = "";
            }

            if (editandoCliente === c.id) {
              lista.appendChild(formEditar(c));
              return;
            }
            if (borrandoCliente === c.id) {
              lista.appendChild(confirmarEliminar(c, susVentas));
              return;
            }

            // botones: editar, llamar, whatsapp, eliminar
            const btns = document.createElement("div");
            btns.className = "ficha-btns";
            const bEditar = document.createElement("button");
            bEditar.type = "button"; bEditar.textContent = "Editar datos";
            bEditar.onclick = () => { editandoCliente = c.id; borrandoCliente = null; dibujarClientes(); };
            btns.appendChild(bEditar);
            const tel = telInternacional(c.telefono);
            if (tel) {
              const quien = c.nombre ? " " + c.nombre : "";
              // llamada normal: la app llama directo (la primera vez pide permiso)
              const aLlamar = document.createElement("a");
              aLlamar.href = "tel:+" + tel; aLlamar.textContent = "Llamar"; aLlamar.className = "llamar";
              btns.appendChild(aLlamar);
              // mensaje de whatsapp: queda escrito, solo falta tocar enviar
              const aWsp = document.createElement("a");
              aWsp.href = "https://wa.me/" + tel + "?text=" + encodeURIComponent("Hola" + quien + ", ¿cómo está? Le escribo por los bidones de agua.");
              aWsp.textContent = "Mensaje WhatsApp"; aWsp.className = "wsp";
              btns.appendChild(aWsp);
              // llamada de whatsapp: sale directo si el numero esta guardado en los contactos
              const aWspLlamar = document.createElement("a");
              // llamar=1: la parte Android busca el contacto y abre la llamada de voz de WhatsApp directo
              aWspLlamar.href = "https://wa.me/" + tel + "?llamar=1"; aWspLlamar.textContent = "Llamada WhatsApp"; aWspLlamar.className = "wsp";
              btns.appendChild(aWspLlamar);
              // cobrar: mensaje con lo que debe
              if (t.deuda > 0) {
                const aCobro = document.createElement("a");
                const msg = "Hola" + quien + ", le recuerdo que tiene un saldo pendiente de " + plata(t.deuda) +
                  " por " + textoPendiente(susVentas) + ". Puede pagar en efectivo, transferencia o tarjeta. ¡Muchas gracias!";
                aCobro.href = "https://wa.me/" + tel + "?text=" + encodeURIComponent(msg);
                aCobro.textContent = "Cobrar por WhatsApp (" + plata(t.deuda) + ")"; aCobro.className = "wsp-cobro ancho";
                btns.appendChild(aCobro);
              }
            } else {
              const sinTel = document.createElement("button");
              sinTel.type = "button"; sinTel.textContent = "+ Agregar teléfono (para llamar y WhatsApp)";
              sinTel.onclick = () => { editandoCliente = c.id; borrandoCliente = null; dibujarClientes(); };
              sinTel.className = "ancho";
              btns.appendChild(sinTel);
            }
            const bBorrar = document.createElement("button");
            bBorrar.type = "button"; bBorrar.textContent = "Eliminar cliente"; bBorrar.className = "rojo ancho";
            if (!tel) bEditar.className = "ancho";
            bBorrar.onclick = () => { borrandoCliente = c.id; editandoCliente = null; dibujarClientes(); };
            btns.appendChild(bBorrar);
            lista.appendChild(btns);

            if (t.deuda > 0) {
              const pend = susVentas.filter(esPendiente);
              if (cobrando === "todo:" + c.id) {
                const caja = opcionesCobro("¿Cómo pagó los " + plata(t.deuda) + " (" + pend.length + (pend.length === 1 ? " pedido" : " pedidos") + ")?");
                botonesCobro(caja, (m) => cobrar(pend, m));
                const envoltura = document.createElement("div");
                envoltura.className = "caja-cobro";
                envoltura.appendChild(caja);
                lista.appendChild(envoltura);
              } else {
                const bt = document.createElement("button");
                bt.type = "button"; bt.className = "btn"; bt.style.background = "var(--ok)"; bt.style.color = "#fff";
                bt.textContent = "Cobrar todo lo que debe (" + plata(t.deuda) + ")";
                bt.onclick = () => { cobrando = "todo:" + c.id; borrarPendiente = null; dibujarClientes(); };
                lista.appendChild(bt);
              }
            }

            const nueva = document.createElement("button");
            nueva.type = "button";
            nueva.className = "btn";
            nueva.textContent = "+ Nueva venta a este cliente";
            nueva.onclick = () => {
              $("nombre").value = c.nombre || ""; $("direccion").value = c.direccion || ""; $("telefono").value = c.telefono || "";
              document.querySelector('.tabs button[data-tab="venta"]').click();
              revisarCliente("nombre");
              $("carrito").scrollIntoView({ block: "center" });
            };
            lista.appendChild(nueva);

            if (susVentas.length === 0) {
              const v = document.createElement("div");
              v.className = "vacio";
              v.textContent = "Este cliente todavía no tiene pedidos.";
              lista.appendChild(v);
              return;
            }

            // resumen por año y por mes
            const porMes = {}, porAnio = {};
            susVentas.forEach(v => {
              const d = new Date(v.ts);
              const km = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
              const ka = String(d.getFullYear());
              if (!porMes[km]) porMes[km] = { c: cuentaVacia(), p: 0 };
              if (!porAnio[ka]) porAnio[ka] = { c: cuentaVacia(), p: 0 };
              porMes[km].c[prod(v)] += v.cantidad; porMes[km].p += v.cantidad * v.precio;
              porAnio[ka].c[prod(v)] += v.cantidad; porAnio[ka].p += v.cantidad * v.precio;
            });

            lista.appendChild(tablaResumen("Por año", porAnio, k => "Año " + k));
            lista.appendChild(tablaResumen("Por mes", porMes, k => {
              const [y, m] = k.split("-").map(Number);
              const meses = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
              return meses[m - 1] + " " + y;
            }));

            // todos los pedidos
            const caja = document.createElement("div");
            caja.className = "dia";
            caja.innerHTML = '<div class="dia-cab"><span>Todos los pedidos</span><span></span></div>';
            caja.querySelector(".dia-cab span:last-child").textContent = susPedidos.length + (susPedidos.length === 1 ? " pedido" : " pedidos");
            susPedidos.forEach(g => caja.appendChild(filaPedido(g, false)));
            lista.appendChild(caja);
          }

          // ej: "10 bid. 20 L y 1 disp. USB" (solo lo que esta pendiente)
          function textoPendiente(susVentas) {
            const cuenta = cuentaVacia();
            susVentas.filter(esPendiente).forEach(v => { cuenta[prod(v)] += v.cantidad; });
            const partes = ORDEN.filter(p => cuenta[p] > 0).map(p => nombreCant(p, cuenta[p]));
            if (partes.length <= 1) return partes.join("");
            return partes.slice(0, -1).join(", ") + " y " + partes[partes.length - 1];
          }

          function cerrarFicha() {
            clienteAbierto = null; borrarPendiente = null; cobrando = null;
            editandoCliente = null; borrandoCliente = null;
          }

          // formulario para cambiar nombre, direccion, telefono y notas
          function formEditar(c) {
            const caja = document.createElement("div");
            caja.className = "caja";
            caja.innerHTML =
              '<h2>Editar cliente</h2>' +
              '<label>Nombre<input type="text" id="edNombre" autocomplete="off"></label>' +
              '<label>Dirección<input type="text" id="edDireccion" autocomplete="off"></label>' +
              '<label>Teléfono (opcional)<div class="tel-fila"><input type="tel" id="edTelefono" inputmode="tel" placeholder="Ej: 9 1234 5678"><button type="button" class="btn-sec2 btn-contactos" id="edContacto">Contactos</button></div></label>' +
              '<label>Notas (opcional)<textarea id="edNotas" placeholder="Ej: casa azul, tocar fuerte"></textarea></label>' +
              '<p class="aviso" id="edAviso"></p>' +
              '<div class="fila-btns"><button type="button" class="btn" id="edGuardar">Guardar cambios</button><button type="button" class="btn-sec2" id="edCancelar">Cancelar</button></div>';
            caja.querySelector("#edNombre").value = c.nombre || "";
            caja.querySelector("#edDireccion").value = c.direccion || "";
            caja.querySelector("#edTelefono").value = c.telefono || "";
            caja.querySelector("#edNotas").value = c.notas || "";

            const bc = caja.querySelector("#edContacto");
            if (!hayAndroid) bc.hidden = true;
            bc.onclick = () => { contactoPara = "editar"; Android.elegirContacto(); };
            caja.querySelector("#edCancelar").onclick = () => { editandoCliente = null; dibujarClientes(); };
            caja.querySelector("#edGuardar").onclick = () => {
              const nombre = caja.querySelector("#edNombre").value.trim();
              const direccion = caja.querySelector("#edDireccion").value.trim();
              const aviso = caja.querySelector("#edAviso");
              if (!nombre && !direccion) { aviso.textContent = "El cliente necesita al menos un nombre o una dirección."; return; }
              const otro = clientes.find(x => x.id !== c.id && nombre && normal(x.nombre) === normal(nombre));
              if (otro) { aviso.textContent = "Ya existe otro cliente llamado " + otro.nombre + ". Usa un nombre distinto (ej: agrega el apellido)."; return; }
              c.nombre = nombre;
              c.direccion = direccion;
              c.telefono = caja.querySelector("#edTelefono").value.trim();
              c.notas = caja.querySelector("#edNotas").value.trim();
              guardar();
              editandoCliente = null;
              avisoFicha = "Datos del cliente guardados.";
              todo();
            };
            return caja;
          }

          // confirmar antes de eliminar un cliente
          function confirmarEliminar(c, susVentas) {
            const caja = document.createElement("div");
            caja.className = "caja confirmar";
            const n = agruparPedidos(susVentas).length;
            const p = document.createElement("p");
            p.textContent = n === 0
              ? "¿Eliminar a " + nombreDe(c) + "? No tiene pedidos."
              : "¿Eliminar a " + nombreDe(c) + "? Tiene " + n + (n === 1 ? " pedido" : " pedidos") + ". Esto no se puede deshacer.";
            caja.appendChild(p);

            const fila = document.createElement("div");
            fila.className = "panel";
            const borrarTodo = document.createElement("button");
            borrarTodo.type = "button"; borrarTodo.className = "btn btn-rojo";
            borrarTodo.textContent = n === 0 ? "Sí, eliminar cliente" : (n === 1 ? "Eliminar cliente y su pedido" : "Eliminar cliente y sus " + n + " pedidos");
            borrarTodo.onclick = () => eliminarCliente(c, true);
            fila.appendChild(borrarTodo);
            if (n > 0) {
              const soloCliente = document.createElement("button");
              soloCliente.type = "button"; soloCliente.className = "btn-sec2";
              soloCliente.textContent = "Eliminar cliente, pero dejar sus pedidos en el historial";
              soloCliente.onclick = () => eliminarCliente(c, false);
              fila.appendChild(soloCliente);
            }
            const cancelar = document.createElement("button");
            cancelar.type = "button"; cancelar.className = "btn-sec";
            cancelar.textContent = "Cancelar";
            cancelar.onclick = () => { borrandoCliente = null; dibujarClientes(); };
            fila.appendChild(cancelar);
            caja.appendChild(fila);
            return caja;
          }

          function eliminarCliente(c, conVentas) {
            if (conVentas) {
              ventas = ventas.filter(v => v.clienteId !== c.id);
            } else {
              // los pedidos quedan, con el nombre guardado para que se sepa de quien eran
              ventas.forEach(v => { if (v.clienteId === c.id) v.nombreBorrado = nombreDe(c); });
            }
            clientes = clientes.filter(x => x.id !== c.id);
            guardar();
            cerrarFicha();
            todo();
          }

          function tablaResumen(titulo, datos, nombreClave) {
            const caja = document.createElement("div");
            caja.className = "dia";
            caja.innerHTML = '<div class="dia-cab"><span></span><span></span></div><div class="tabla-scroll"><table class="resumen-tabla"><thead><tr><th></th><th>20 L</th><th>10 L</th><th>Nuevos</th><th>Disp.</th><th>Total</th></tr></thead><tbody></tbody></table></div>';
            caja.querySelector(".dia-cab span:first-child").textContent = titulo;
            const cuerpo = caja.querySelector("tbody");
            Object.keys(datos).sort().reverse().forEach(k => {
              const tr = document.createElement("tr");
              tr.innerHTML = "<td></td><td></td><td></td><td></td><td></td><td></td>";
              const tds = tr.querySelectorAll("td");
              const c = datos[k].c;
              tds[0].textContent = nombreClave(k);
              tds[1].textContent = c.b20;
              tds[2].textContent = c.b10;
              tds[3].textContent = c.n20 + c.n10;
              tds[4].textContent = c.dusb + c.dbas;
              tds[5].textContent = plata(datos[k].p);
              if (datos[k].pend > 0) {
                const sp = document.createElement("span");
                sp.className = "mini-debe";
                sp.textContent = "debe " + plata(datos[k].pend);
                tds[5].appendChild(sp);
              }
              cuerpo.appendChild(tr);
            });
            return caja;
          }
          $("buscar").addEventListener("input", dibujarClientes);
          function ponerFiltro(deudores) {
            soloDeudores = deudores;
            $("filtroTodos").classList.toggle("activo", !deudores);
            $("filtroDeben").classList.toggle("activo", deudores);
            dibujarClientes();
          }
          $("filtroTodos").onclick = () => ponerFiltro(false);
          $("filtroDeben").onclick = () => ponerFiltro(true);

          // ===================== HISTORIAL =====================
          function dibujarHistorial() {
            const lista = $("listaHistorial");
            lista.innerHTML = "";
            dibujarCierre();
            if (ventas.length === 0) {
              lista.innerHTML = '<div class="vacio">Todavía no hay ventas registradas.</div>';
              return;
            }
            // resumen por mes: unidades de cada producto, total vendido y lo que falta cobrar
            const porMes = {};
            ventas.forEach(v => {
              const d = new Date(v.ts);
              const km = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
              if (!porMes[km]) porMes[km] = { c: cuentaVacia(), p: 0, pend: 0 };
              porMes[km].c[prod(v)] += v.cantidad;
              porMes[km].p += v.cantidad * v.precio;
              if (esPendiente(v)) porMes[km].pend += v.cantidad * v.precio;
            });
            const tabla = tablaResumen("Resumen por mes", porMes, k => {
              const [y, m] = k.split("-").map(Number);
              const meses = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
              return meses[m - 1] + " " + y;
            });
            lista.appendChild(tabla);

            const porDia = {};
            ventas.slice().sort((a, b) => b.ts - a.ts).forEach(v => {
              const k = claveDia(v.ts);
              if (!porDia[k]) porDia[k] = [];
              porDia[k].push(v);
            });
            Object.keys(porDia).sort().reverse().forEach(k => {
              const items = porDia[k];
              let b = 0, p = 0;
              items.forEach(v => { b += v.cantidad; p += v.cantidad * v.precio; });
              const caja = document.createElement("div");
              caja.className = "dia";
              caja.innerHTML = '<div class="dia-cab"><span></span><span></span></div>';
              caja.querySelector(".dia-cab span:first-child").textContent = nombreDia(k);
              caja.querySelector(".dia-cab span:last-child").textContent = b + " unid. · " + plata(p);
              agruparPedidos(items).forEach(g => caja.appendChild(filaPedido(g, true)));
              lista.appendChild(caja);
            });
          }

          // cierre del dia: resumen para mandar por WhatsApp
          function dibujarCierre() {
            const hoy = claveDia(Date.now());
            const cant = cuentaVacia(), monto = cuentaVacia();
            const medio = { efectivo: 0, transferencia: 0, tarjeta: 0 };
            let total = 0, pendHoy = 0, pendTotal = 0;
            const pedidosHoy = agruparPedidos(ventas.filter(v => claveDia(v.ts) === hoy)).length;
            ventas.forEach(v => {
              const m = v.cantidad * v.precio;
              if (esPendiente(v)) pendTotal += m;
              if (claveDia(v.ts) === hoy) {
                cant[prod(v)] += v.cantidad; monto[prod(v)] += m; total += m;
                if (esPendiente(v)) pendHoy += m;
              }
              if (!esPendiente(v) && claveDia(v.fechaPago || v.ts) === hoy && medio[v.pago] !== undefined) medio[v.pago] += m;
            });
            const f = new Date().toLocaleDateString("es-CL", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
            let txt = "*Cierre del día - Agua Poseidon*\n" + f.charAt(0).toUpperCase() + f.slice(1) + "\n\n";
            const vendidos = ORDEN.filter(p => cant[p] > 0);
            if (vendidos.length === 0) txt += "Sin ventas hoy.\n";
            vendidos.forEach(p => { txt += PRODUCTOS[p].nombre + ": " + cant[p] + " (" + plata(monto[p]) + ")\n"; });
            txt += "\nPedidos: " + pedidosHoy + "\n";
            txt += "*Total vendido: " + plata(total) + "*\n\n";
            txt += "Cobrado hoy:\n";
            txt += "Efectivo: " + plata(medio.efectivo) + "\n";
            txt += "Transferencia: " + plata(medio.transferencia) + "\n";
            txt += "Tarjeta: " + plata(medio.tarjeta) + "\n";
            txt += "*Total cobrado: " + plata(medio.efectivo + medio.transferencia + medio.tarjeta) + "*\n\n";
            txt += "Quedó pendiente hoy: " + plata(pendHoy) + "\n";
            txt += "Total por cobrar (todos los días): " + plata(pendTotal);
            $("textoCierre").textContent = txt.replace(/\*/g, "");
            $("btnCierre").href = "https://wa.me/?text=" + encodeURIComponent(txt);
          }

          // ===================== AJUSTES =====================
          $("btnPrecio").onclick = () => {
            for (const p of ORDEN) {
              const txt = $("precio_" + p).value.trim();
              const n = txt === "" ? 0 : parseInt(txt, 10);
              if (isNaN(n) || n < 0) { $("avisoPrecio").textContent = "Revisa el " + PRODUCTOS[p].precioTxt.toLowerCase() + "."; return; }
              precios[p] = n;
            }
            guardar();
            nuevoCarrito();
            $("avisoPrecio").textContent = "Precios guardados.";
          };

          // ===================== RESPALDO Y EXCEL =====================
          // la parte de Android (MainActivity) abre la ventana para elegir donde guardar o que archivo abrir
          const hayAndroid = typeof window.Android !== "undefined";
          let guardandoQue = "";

          function fechaArchivo() {
            const d = new Date();
            return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
          }
          function mostrarUltimoRespaldo() {
            let ult = 0;
            try { ult = Number(localStorage.getItem("cb_ultimoRespaldo") || 0); } catch (e) {}
            $("ultimoRespaldo").textContent = ult
              ? "Último respaldo: " + new Date(ult).toLocaleDateString("es-CL", { day: "numeric", month: "long", year: "numeric" })
              : "Todavía no has guardado ningún respaldo.";
            return ult;
          }

          $("btnRespaldo").onclick = () => {
            const datos = { app: "contador-bidones-poseidon", version: 6, fecha: Date.now(), clientes: clientes, ventas: ventas, precios: precios };
            guardandoQue = "respaldo";
            $("avisoRespaldo").textContent = "Elige dónde guardar el respaldo (Drive o el teléfono)...";
            Android.guardarArchivo("respaldo-bidones-" + fechaArchivo() + ".json", "application/json", JSON.stringify(datos));
          };

          $("btnRecuperar").onclick = () => {
            guardandoQue = "";
            $("avisoRespaldo").textContent = "Elige el archivo de respaldo...";
            Android.abrirArchivo();
          };

          function csvCampo(x) {
            const t = String(x === undefined || x === null ? "" : x);
            return /[";\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
          }
          $("btnExcel").onclick = () => {
            const filas = [["Fecha", "Hora", "Cliente", "Dirección", "Teléfono", "Producto", "Cantidad", "Precio unitario", "Total", "Pago", "Fecha de pago"]];
            ventas.slice().sort((a, b) => a.ts - b.ts).forEach(v => {
              const c = clientes.find(x => x.id === v.clienteId);
              const d = new Date(v.ts);
              filas.push([
                d.toLocaleDateString("es-CL"),
                d.toLocaleTimeString("es-CL", { hour: "2-digit", minute: "2-digit" }),
                c ? nombreDe(c) : (v.nombreBorrado || "Cliente borrado"),
                c ? c.direccion : "",
                c ? (c.telefono || "") : "",
                PRODUCTOS[prod(v)].nombre,
                v.cantidad,
                v.precio,
                v.cantidad * v.precio,
                esPendiente(v) ? "Pendiente" : (MEDIOS[v.pago] || "Pagado"),
                v.fechaPago ? new Date(v.fechaPago).toLocaleDateString("es-CL") : ""
              ]);
            });
            // punto y coma: asi lo abre bien Excel en Chile. \uFEFF para que se vean los tildes
            const csv = "\uFEFF" + filas.map(f => f.map(csvCampo).join(";")).join("\r\n");
            guardandoQue = "excel";
            Android.guardarArchivo("ventas-bidones-" + fechaArchivo() + ".csv", "text/csv", csv);
          };

          // elegir un contacto de la agenda del telefono
          $("btnContactoVenta").onclick = () => { contactoPara = "venta"; Android.elegirContacto(); };
          function contactoElegido(nombre, numero) {
            if (contactoPara === "editar") {
              if ($("edTelefono")) $("edTelefono").value = numero;
              if ($("edNombre") && !$("edNombre").value.trim()) $("edNombre").value = nombre;
            } else {
              $("telefono").value = numero;
              if (!$("nombre").value.trim() && nombre) {
                $("nombre").value = nombre;
                revisarCliente("nombre");
              }
            }
            contactoPara = "";
          }
          function contactoCancelado() {
            contactoPara = "";
          }

          // respuestas que manda la parte de Android
          function archivoGuardado() {
            if (guardandoQue === "respaldo") {
              try { localStorage.setItem("cb_ultimoRespaldo", String(Date.now())); } catch (e) {}
              mostrarUltimoRespaldo();
              $("avisoRespaldo").textContent = "Respaldo guardado.";
            } else {
              $("avisoRespaldo").textContent = "Archivo de Excel guardado.";
            }
            guardandoQue = "";
          }
          function archivoCancelado() {
            $("avisoRespaldo").textContent = "";
            guardandoQue = "";
          }
          function archivoError() {
            $("avisoRespaldo").textContent = "No se pudo guardar o leer el archivo. Intenta de nuevo y elige otra carpeta.";
            guardandoQue = "";
          }
          function recibirArchivo(texto) {
            let datos = null;
            try { datos = JSON.parse(texto); } catch (e) {}
            if (!datos || !Array.isArray(datos.clientes) || !Array.isArray(datos.ventas)) {
              $("avisoRespaldo").textContent = "Ese archivo no es un respaldo de esta app. Elige el archivo respaldo-bidones-....json";
              return;
            }
            respaldoPorRecuperar = datos;
            $("avisoRespaldo").textContent = "";
            const caja = $("confirmarRecuperar");
            caja.innerHTML = "";
            const box = document.createElement("div");
            box.className = "caja confirmar";
            const p = document.createElement("p");
            const fecha = datos.fecha ? new Date(datos.fecha).toLocaleDateString("es-CL", { day: "numeric", month: "long", year: "numeric" }) : "fecha desconocida";
            p.textContent = "Respaldo del " + fecha + ": " + datos.clientes.length + " clientes y " + datos.ventas.length + " ventas. Esto REEMPLAZA todo lo que hay ahora en la app. ¿Seguro?";
            box.appendChild(p);
            const fila = document.createElement("div");
            fila.className = "fila-btns";
            const si = document.createElement("button");
            si.type = "button"; si.className = "btn btn-rojo"; si.textContent = "Sí, recuperar";
            si.onclick = () => {
              clientes = respaldoPorRecuperar.clientes;
              ventas = respaldoPorRecuperar.ventas;
              if (respaldoPorRecuperar.precios) ORDEN.forEach(k => { precios[k] = Number(respaldoPorRecuperar.precios[k]) || 0; });
              respaldoPorRecuperar = null;
              guardar();
              ORDEN.forEach(k => { $("precio_" + k).value = precios[k] || ""; });
              nuevoCarrito();
              caja.innerHTML = "";
              $("avisoRespaldo").textContent = "Datos recuperados: " + clientes.length + " clientes y " + ventas.length + " ventas.";
              todo();
            };
            const no = document.createElement("button");
            no.type = "button"; no.className = "btn-sec2"; no.textContent = "Cancelar";
            no.onclick = () => { respaldoPorRecuperar = null; caja.innerHTML = ""; };
            fila.appendChild(si); fila.appendChild(no);
            box.appendChild(fila);
            caja.appendChild(box);
          }

          // ===================== PESTAÑAS =====================
          document.querySelectorAll(".tabs button").forEach(b => {
            b.onclick = () => {
              document.querySelectorAll(".tabs button").forEach(x => x.classList.toggle("activo", x === b));
              ["venta", "clientes", "historial", "ajustes"].forEach(t => { $("tab-" + t).hidden = t !== b.dataset.tab; });
              borrarPendiente = null;
              cobrando = null;
              editandoCliente = null; borrandoCliente = null;
              if (b.dataset.tab !== "clientes") clienteAbierto = null;
              todo();
            };
          });

          // ===================== INICIO =====================
          function todo() {
            dibujarResumen();
            llenarSugerencias();
            dibujarClientes();
            dibujarHistorial();
          }

          const textoFecha = new Date().toLocaleDateString("es-CL", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
          $("fechaHoy").textContent = textoFecha.charAt(0).toUpperCase() + textoFecha.slice(1);
          cargar();
          ORDEN.forEach(p => { $("precio_" + p).value = precios[p] || ""; });
          nuevoCarrito();
          todo();
          if (!hayAndroid) {
            // abierto fuera de la app (navegador): no hay como guardar archivos
            $("cajaRespaldo").hidden = true;
            $("cajaExcel").hidden = true;
            $("btnContactoVenta").hidden = true;
          }
          const ultimo = mostrarUltimoRespaldo();
          if (!precios.b20) {
            $("avisoVenta").textContent = "Consejo: guarda los precios en Ajustes para que aparezcan solos.";
          } else if (hayAndroid && ventas.length > 0 && Date.now() - ultimo > 7 * 86400000) {
            $("avisoVenta").textContent = "Recuerda guardar un respaldo en Ajustes (hace más de una semana que no se hace).";
          }
          </script>
          </body>
          </html>
